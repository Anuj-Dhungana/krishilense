
  <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064E3B"/>
        <stop offset="60%" stop-color="#047857"/>
        <stop offset="100%" stop-color="#10B981"/>
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F59E0B"/>
        <stop offset="50%" stop-color="#FBBF24"/>
        <stop offset="100%" stop-color="#FEF08A"/>
      </linearGradient>
      <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34D399"/>
        <stop offset="100%" stop-color="#A7F3D0"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10.24" stdDeviation="15.36" flood-color="#022c22" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- Background Card -->
    <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>

    <!-- Subtle Inner Border Glow -->
    <rect x="10.24" y="10.24" width="491.52" height="491.52" rx="101.376" fill="none" stroke="#6EE7B7" stroke-width="7.68" stroke-opacity="0.3"/>

    <!-- Main Wheat & Sprout Symbol -->
    <g transform="translate(256, 256) scale(4.3008)" filter="url(#shadow)">
      <!-- Central Stalk -->
      <path d="M 0 35 C 0 5 -5 -15 -12 -38" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 0 35 C 0 10 5 -10 12 -38" fill="none" stroke="url(#leafGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 0 38 L 0 -42" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round"/>

      <!-- Golden Wheat Grains (Left Side) -->
      <path d="M 0 15 C -14 12 -22 -2 -14 -8 C -6 -12 0 4 0 15 Z" fill="url(#goldGrad)"/>
      <path d="M 0 -2 C -16 -6 -24 -20 -15 -26 C -6 -28 0 -12 0 -2 Z" fill="url(#goldGrad)"/>
      <path d="M 0 -18 C -14 -22 -20 -34 -12 -40 C -4 -42 0 -28 0 -18 Z" fill="url(#goldGrad)"/>

      <!-- Vibrant Green Sprout Leaves (Right Side) -->
      <path d="M 0 20 C 14 16 24 0 16 -6 C 8 -10 0 7 0 20 Z" fill="url(#leafGrad)"/>
      <path d="M 0 4 C 16 0 26 -14 17 -21 C 8 -24 0 -7 0 4 Z" fill="url(#leafGrad)"/>
      <path d="M 0 -12 C 14 -16 22 -28 14 -34 C 6 -36 0 -22 0 -12 Z" fill="url(#leafGrad)"/>

      <!-- Top Seed Head -->
      <ellipse cx="0" cy="-44" rx="4.5" ry="9" fill="url(#goldGrad)"/>
      <circle cx="0" cy="-52" r="2.5" fill="#FEF08A"/>
    </g>
  </svg>
  