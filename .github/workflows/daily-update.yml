name: Daily Market Ingestion

on:
  schedule:
    # 07:15 UTC = 1:00 PM Nepal Time (Runs automatically every day!)
    - cron: '15 7 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub

concurrency:
  group: market-data-ingestion
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Live Government Prices & Update Neon
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/fetch-live-ampis.ts
